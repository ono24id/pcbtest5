# Runs once, on the first push of a repository created from this template:
# renames PROJECT_NAME to the repository name and commits the result.
# Afterwards sources/PROJECT_NAME no longer exists, so every later run is a no-op.
name: Template init

on:
  push:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  init:
    if: ${{ !github.event.repository.is_template && github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Only rename in repositories generated from the template, never in the template
      # itself (it may not be flagged as a template yet when it is first pushed).
      # A manual "Run workflow" skips this check.
      - name: Check whether initialisation is needed
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -d sources/PROJECT_NAME ]; then
            echo "Already initialised."
            exit 0
          fi
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            tpl="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.template_repository.full_name // empty')"
            if [ -z "$tpl" ]; then
              echo "Not generated from a template (this is the template repository), skipping."
              exit 0
            fi
            echo "Generated from $tpl"
          fi
          echo "needed=true" >> "$GITHUB_OUTPUT"

      - name: Rename project
        if: steps.check.outputs.needed == 'true'
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: bash scripts/init.sh "$REPO_NAME"

      - name: Commit and push
        if: steps.check.outputs.needed == 'true'
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Initialise project ${REPO_NAME} from template"
          git push

      # Pushes made with GITHUB_TOKEN don't trigger other workflows, so kick CI manually.
      - name: Run KiCad CI on the renamed project
        if: steps.check.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run kicad.yml --ref "${{ github.ref_name }}"
